name: Scrape Hourly Rainfall

on:
  workflow_dispatch:
  schedule:
    - cron: '42 * * * *'

permissions:
  contents: write

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scrape with Step Retries
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_on: error
          command: |
            PYTHONPATH=src uv run python -m dd_data.cli scrape hourly-rainfall
