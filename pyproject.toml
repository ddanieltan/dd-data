[project]
name = "dd-data"
version = "0.1.0"
description = "Centralized Git-Scraping Engine with Pydantic Schema Guards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
